[project]
name = "synthpop"
version = "0.1.0"
description = "Synthetic population & behavioral simulation platform (Stage 1 MVP)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14",
    "pandas>=2.0",
    "pyyaml>=6",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
